name: Frontend QA

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: mcr.microsoft.com/playwright/python:v1.56.0-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Make
        run: |
          apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          apt-get install -y --no-install-recommends make
      - name: Install Python test dependencies
        run: python -m pip install 'jsonschema>=4.18,<5' 'playwright==1.56.0'
      # JavaScript tests use only Node built-ins; the image supplies browser binaries.
      - name: Validate data, frontend, and maintenance tools
        run: make check
      - name: Check mobile and desktop browser behavior
        env:
          PLAYWRIGHT_BROWSER_CHANNEL: chromium
        run: make check-ui
